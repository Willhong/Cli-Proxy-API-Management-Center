# llmproxy-share: forwards only to llmproxy on nucbox. Host is pinned, so no other ingress site is reachable.
server {
    listen 127.0.0.1:8080;
    client_max_body_size 64m;

    # management UI/API stay tailnet-internal
    location = /management.html { return 404; }
    location ^~ /v0/management { return 404; }
    # read-only usage filter (usage_filter.py): only GET /credentials and usage api-call reads pass
    location ^~ /v8/management {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        client_max_body_size 8k;
    }

    location / {
        proxy_pass https://100.77.154.10;
        proxy_http_version 1.1;
        proxy_set_header Host llmproxy.hktlabs.com;
        proxy_ssl_server_name on;
        proxy_ssl_name llmproxy.hktlabs.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
        proxy_ssl_verify_depth 3;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
